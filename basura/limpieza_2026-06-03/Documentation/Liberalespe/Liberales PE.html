<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liberales PE — Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #2A1F17; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Focus rings */
    *:focus-visible {
      outline: 3px solid #C25A1A;
      outline-offset: 2px;
    }

    /* Artboard frames */
    .frame-mobile {
      width: 375px;
      height: 812px;
      overflow: hidden;
      border-radius: 12px;
      position: relative;
      background: #FAF6EF;
    }
    .frame-desktop {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
      background: #FAF6EF;
    }
    .frame-admin {
      width: 1280px;
      height: 780px;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
      background: #FAF6EF;
    }

    /* Scrollable frame internals */
    .frame-scroll {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .frame-scroll::-webkit-scrollbar { width: 4px; }
    .frame-scroll::-webkit-scrollbar-track { background: transparent; }
    .frame-scroll::-webkit-scrollbar-thumb { background: #E2CDB6; border-radius: 2px; }

    /* Navbar for citizen views */
    .citizen-nav {
      background: #4A2C1A;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .citizen-nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-weight: 700;
      color: #FAF6EF;
    }
    .citizen-nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .citizen-nav-link {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: rgba(250,246,239,0.7);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Bottom nav for mobile */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFDF8;
      border-top: 1px solid #E2CDB6;
      display: flex;
      height: 56px;
      padding-bottom: 4px;
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      color: #7A6654;
      cursor: pointer;
      background: none;
      border: none;
    }
    .bottom-nav-item.active {
      color: #C25A1A;
    }

    /* Section label */
    .dc-section-label {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(250,246,239,0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 20px 0 8px;
    }
  </style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens/Login.jsx"></script>
<script type="text/babel" src="screens/Register.jsx"></script>
<script type="text/babel" src="screens/Profile.jsx"></script>
<script type="text/babel" src="screens/Admin.jsx"></script>

<div id="root" style="height:100%"></div>

<script type="text/babel">

// ─── Tweaks defaults ──────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "viewMode": "auth",
  "userState": "activo_afiliado",
  "isFundador": true,
  "density": "normal"
}/*EDITMODE-END*/;

// ─── Shared nav wrapper (citizen) ────────────────────────────────────────────
const CitizenShell = ({ children, active, onNavigate, mobile }) => (
  <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <nav className="citizen-nav">
      <div className="citizen-nav-logo">
        <svg width="20" height="20" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="#FAF6EF" opacity="0.15"/>
          <path d="M10 26V12l8-4 8 4v14H22v-7h-4v7H10z" fill="#FAF6EF" opacity="0.9"/>
        </svg>
        Liberales
      </div>
      {!mobile && (
        <div className="citizen-nav-actions">
          <button className="citizen-nav-link" onClick={()=>onNavigate&&onNavigate('profile')}>Mi perfil</button>
          <button className="citizen-nav-link" style={{color:'rgba(250,246,239,0.45)'}}>Cerrar sesión</button>
        </div>
      )}
    </nav>
    <div className="frame-scroll" style={{flex:1, paddingBottom: mobile ? 56 : 0}}>
      {children}
    </div>
    {mobile && (
      <nav className="bottom-nav">
        <button className={`bottom-nav-item ${active==='profile'?'active':''}`} onClick={()=>onNavigate&&onNavigate('profile')}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Perfil
        </button>
        <button className="bottom-nav-item" style={{color:'rgba(122,102,84,0.4)'}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Salir
        </button>
      </nav>
    )}
  </div>
);

// ─── User state presets ───────────────────────────────────────────────────────
const USER_STATES = {
  activo_no_validado: { nombre:'María Alejandra Torres Quispe', dni:'45892316', telefono:'+51 987 654 321', estado:'activo', tipo:'adherente', validado:false, solicitudPendiente:false },
  activo_validado:    { nombre:'María Alejandra Torres Quispe', dni:'45892316', telefono:'+51 987 654 321', estado:'activo', tipo:'adherente', validado:true, solicitudPendiente:false },
  activo_afiliado:    { nombre:'María Alejandra Torres Quispe', dni:'45892316', telefono:'+51 987 654 321', estado:'activo', tipo:'afiliado',  validado:true, solicitudPendiente:false },
  con_solicitud:      { nombre:'María Alejandra Torres Quispe', dni:'45892316', telefono:'+51 987 654 321', estado:'activo', tipo:'adherente', validado:true, solicitudPendiente:true },
  anulado:            { nombre:'María Alejandra Torres Quispe', dni:'45892316', telefono:'+51 987 654 321', estado:'anulado', tipo:'adherente', validado:true, solicitudPendiente:false },
};

// ─── Error / Empty States Screen ─────────────────────────────────────────────
const ErrorStatesScreen = () => {
  const states = [
    { icon: <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E2CDB6" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
      title: 'Sin conexión', text: 'No se pudo conectar al servidor. Verifica tu conexión e intenta nuevamente.', btn: 'Reintentar' },
    { icon: <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E2CDB6" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
      title: 'Acceso restringido', text: 'No tienes permisos para ver esta sección.', btn: null },
    { icon: <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E2CDB6" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>,
      title: 'Padrón vacío', text: 'El padrón está vacío. Los usuarios aparecerán aquí cuando se registren.', btn: null },
  ];
  return (
    <div style={{background:'#FAF6EF',minHeight:'100%',padding:'24px',display:'flex',flexWrap:'wrap',gap:16,alignItems:'flex-start',justifyContent:'center',fontFamily:"'Lato',sans-serif"}}>
      {states.map((s,i) => (
        <div key={i} style={{background:'#FFFDF8',border:'1px solid #E2CDB6',borderRadius:6,padding:'40px 32px',textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:14,width:260,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
          {s.icon}
          <h3 style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:'#1C120B'}}>{s.title}</h3>
          <p style={{fontSize:13,color:'#6B4E3D',lineHeight:1.6,margin:0}}>{s.text}</p>
          {s.btn && <button style={{height:36,padding:'0 18px',background:'none',border:'1px solid #E2CDB6',borderRadius:4,fontSize:13,color:'#6B4E3D',cursor:'pointer',fontFamily:"'Lato',sans-serif"}}>{s.btn}</button>}
        </div>
      ))}
    </div>
  );
};

// ─── Main App ─────────────────────────────────────────────────────────────────
const App = () => {
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;
  const [tweaks, setTweakState] = React.useState(TWEAK_DEFAULTS);
  const setTweak = (key, val) => {
    const next = typeof key === 'object' ? {...tweaks,...key} : {...tweaks,[key]:val};
    setTweakState(next);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits: next},'*');
  };

  const userState = USER_STATES[tweaks.userState] || USER_STATES.activo_no_validado;

  // Section: Auth
  const AuthSection = () => (
    <DCSection id="auth" title="Autenticación">
      <DCArtboard id="login-mobile" label="Login — Mobile" width={375} height={812}>
        <div className="frame-mobile"><div className="frame-scroll">
          <LoginScreen onNavigate={()=>{}}/>
        </div></div>
      </DCArtboard>
      <DCArtboard id="login-desktop" label="Login — Desktop" width={1280} height={680}>
        <div className="frame-desktop" style={{height:680}}>
          <div className="frame-scroll">
            <LoginScreen onNavigate={()=>{}}/>
          </div>
        </div>
      </DCArtboard>
    </DCSection>
  );

  // Section: Registration
  const RegSection = () => (
    <DCSection id="registro" title="Registro">
      <DCArtboard id="reg-step1" label="Paso 1 — DNI" width={375} height={700}>
        <div style={{width:375,height:700,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterStepPreview step={1}/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-step2a" label="Paso 2 — Nombre (autocompletado)" width={375} height={700}>
        <div style={{width:375,height:700,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterStepPreview step={2} autoFilled={true}/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-step2b" label="Paso 2 — Nombre (servicio caído)" width={375} height={700}>
        <div style={{width:375,height:700,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterStepPreview step={2} autoFilled={false} serviceFailed={true}/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-step3" label="Paso 3 — Teléfono" width={375} height={700}>
        <div style={{width:375,height:700,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterStepPreview step={3}/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-step4" label="Paso 4 — Contraseña" width={375} height={760}>
        <div style={{width:375,height:760,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterStepPreview step={4}/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-confirm" label="Confirmación de registro" width={375} height={600}>
        <div style={{width:375,height:600,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <RegisterDonePreview/>
        </div>
      </DCArtboard>
      <DCArtboard id="reg-desktop" label="Registro — Desktop (paso 1)" width={1280} height={680}>
        <div className="frame-desktop" style={{height:680}}>
          <div className="frame-scroll"><RegisterStepPreview step={1}/></div>
        </div>
      </DCArtboard>
    </DCSection>
  );

  // Section: Citizen profile
  const ProfileSection = () => (
    <DCSection id="perfil" title="Perfil ciudadano">
      <DCArtboard id="profile-mobile" label={`Perfil — ${tweaks.userState.replace(/_/g,' ')}`} width={375} height={812}>
        <div className="frame-mobile">
          <CitizenShell active="profile" mobile={true} onNavigate={()=>{}}>
            <ProfileScreen userState={userState} onNavigate={()=>{}}/>
          </CitizenShell>
        </div>
      </DCArtboard>
      <DCArtboard id="profile-desktop" label="Perfil — Desktop" width={1280} height={800}>
        <div className="frame-desktop">
          <CitizenShell active="profile" mobile={false} onNavigate={()=>{}}>
            <ProfileScreen userState={userState} onNavigate={()=>{}}/>
          </CitizenShell>
        </div>
      </DCArtboard>
    </DCSection>
  );

  // Section: Request forms
  const FormsSection = () => (
    <DCSection id="solicitudes" title="Formularios de solicitud">
      <DCArtboard id="afiliacion-mobile" label="Solicitar afiliación — Mobile" width={375} height={700}>
        <div style={{width:375,height:700,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <CitizenShell active="profile" mobile={true} onNavigate={()=>{}}>
            <AffiliationScreen onNavigate={()=>{}}/>
          </CitizenShell>
        </div>
      </DCArtboard>
      <DCArtboard id="desafiliacion-mobile" label="Solicitar desafiliación — Mobile" width={375} height={780}>
        <div style={{width:375,height:780,overflow:'hidden',borderRadius:12,background:'#FAF6EF'}}>
          <CitizenShell active="profile" mobile={true} onNavigate={()=>{}}>
            <DisaffiliationScreen onNavigate={()=>{}}/>
          </CitizenShell>
        </div>
      </DCArtboard>
      <DCArtboard id="afiliacion-desktop" label="Solicitar afiliación — Desktop" width={1280} height={600}>
        <div className="frame-desktop" style={{height:600}}>
          <CitizenShell active="profile" mobile={false} onNavigate={()=>{}}>
            <AffiliationScreen onNavigate={()=>{}}/>
          </CitizenShell>
        </div>
      </DCArtboard>
    </DCSection>
  );

  // Section: Admin
  const AdminSection = () => (
    <DCSection id="admin" title="Panel de Administración">
      <DCArtboard id="admin-padron" label="Padrón — Desktop" width={1280} height={780}>
        <div className="frame-admin">
          <AdminPanel isFundador={tweaks.isFundador}/>
        </div>
      </DCArtboard>
      <DCArtboard id="admin-detalle" label="Detalle de usuario — Desktop" width={1280} height={780}>
        <AdminDetailPreview isFundador={tweaks.isFundador}/>
      </DCArtboard>
    </DCSection>
  );

  // Section: Error states
  const ErrorSection = () => (
    <DCSection id="errores" title="Estados vacíos y errores">
      <DCArtboard id="error-states" label="Estados de error / empty" width={900} height={420}>
        <div style={{width:900,height:420,overflow:'hidden',borderRadius:8}}>
          <ErrorStatesScreen/>
        </div>
      </DCArtboard>
    </DCSection>
  );

  return (
    <>
      <DesignCanvas>
        <AuthSection/>
        <RegSection/>
        <ProfileSection/>
        <FormsSection/>
        <AdminSection/>
        <ErrorSection/>
      </DesignCanvas>

      {/* Tweaks Panel */}
      <TweaksPanel>
        <TweakSection title="Vista">
          <TweakRadio
            label="Sección activa"
            value={tweaks.viewMode}
            options={[{value:'all',label:'Todas'},{value:'auth',label:'Auth'},{value:'admin',label:'Admin'}]}
            onChange={v=>setTweak('viewMode',v)}
          />
        </TweakSection>
        <TweakSection title="Estado del ciudadano">
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {Object.keys(USER_STATES).map(key => (
              <label key={key} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,fontFamily:"'Lato',sans-serif",color: tweaks.userState===key?'#C25A1A':'#4A2C1A',fontWeight:tweaks.userState===key?700:400}}>
                <input type="radio" name="userState" value={key} checked={tweaks.userState===key} onChange={()=>setTweak('userState',key)} style={{accentColor:'#C25A1A'}}/>
                {key.replace(/_/g,' ')}
              </label>
            ))}
          </div>
        </TweakSection>
        <TweakSection title="Permisos">
          <TweakToggle label="Vista de Fundador" value={tweaks.isFundador} onChange={v=>setTweak('isFundador',v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

// ─── Static step previews (non-interactive, for artboards) ───────────────────
const RegisterStepPreview = ({ step, autoFilled, serviceFailed }) => {
  const stepLabels = ['Tu DNI','Tu nombre','Tu contacto','Tu contraseña'];
  const strengthColors = ['#B42318','#B45309','#4D7C0F'];
  return (
    <div style={{minHeight:'100%',background:'#FAF6EF',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px 16px',fontFamily:"'Lato',sans-serif"}}>
      <div style={{background:'#FFFDF8',border:'1px solid #E2CDB6',borderRadius:6,padding:'28px 28px',width:'100%',maxWidth:400,display:'flex',flexDirection:'column',gap:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:18}}>
          <svg width="24" height="24" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="18" fill="#4A2C1A"/><path d="M10 26V12l8-4 8 4v14H22v-7h-4v7H10z" fill="#FAF6EF" opacity="0.9"/></svg>
          <span style={{fontFamily:"'EB Garamond',serif",fontSize:18,fontWeight:700,color:'#4A2C1A'}}>Liberales</span>
        </div>
        <div style={{marginBottom:20}}>
          <span style={{fontSize:11,color:'#7A6654',fontWeight:700,letterSpacing:'0.05em',textTransform:'uppercase',display:'block',marginBottom:5}}>Paso {step} de 4 — {stepLabels[step-1]}</span>
          <div style={{height:4,background:'#EFE3D3',borderRadius:2}}><div style={{width:`${(step/4)*100}%`,height:'100%',background:'#C25A1A',borderRadius:2}}></div></div>
        </div>

        {step===1 && <>
          <h1 style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:'#1C120B',margin:'0 0 16px',lineHeight:1.3}}>¿Cuál es tu número de DNI?</h1>
          <FieldPreview label="Número de DNI" value="" mono helper="Tu DNI es la clave de acceso al sistema. Debe ser válido."/>
          <BtnPreview>Continuar</BtnPreview>
        </>}

        {step===2 && <>
          <h1 style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:'#1C120B',margin:'0 0 12px',lineHeight:1.3}}>¿Cuáles son tus nombres y apellidos?</h1>
          {autoFilled && <div style={{display:'flex',alignItems:'flex-start',gap:8,background:'#FFF7ED',border:'1px solid #F5D8B0',borderRadius:6,padding:'10px 12px',fontSize:12,color:'#6B4E3D',marginBottom:14,lineHeight:1.4}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B45309" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Nombre obtenido del Registro Nacional. Puedes editarlo si hay un error.</div>}
          {serviceFailed && <div style={{display:'flex',alignItems:'flex-start',gap:8,background:'#FEF0C7',border:'1px solid #F5D48A',borderRadius:6,padding:'10px 12px',fontSize:12,color:'#8A4B0F',marginBottom:14,lineHeight:1.4}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B45309" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>No pudimos verificar tu DNI automáticamente. Por favor ingresa tu nombre completo.</div>}
          <FieldPreview label="Nombres" value={autoFilled?"María Alejandra":""}/>
          <FieldPreview label="Apellidos" value={autoFilled?"Torres Quispe":""}/>
          <BtnPreview>{autoFilled?'Confirmar nombre':'Continuar'}</BtnPreview>
        </>}

        {step===3 && <>
          <h1 style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:'#1C120B',margin:'0 0 16px',lineHeight:1.3}}>¿Cuál es tu número de teléfono?</h1>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1C120B',marginBottom:6}}>Número de teléfono</div>
            <div style={{display:'flex',gap:8}}>
              <div style={{height:44,width:54,border:'1px solid #E2CDB6',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#7A6654',flexShrink:0,background:'#FAF6EF'}}>+51</div>
              <div style={{flex:1,height:44,border:'1px solid #E2CDB6',borderRadius:6,background:'#FFFDF8'}}></div>
            </div>
            <div style={{fontSize:11,color:'#7A6654',marginTop:5,fontWeight:300}}>Este número puede ser usado por operadores del partido para contactarte.</div>
          </div>
          <BtnPreview>Continuar</BtnPreview>
        </>}

        {step===4 && <>
          <h1 style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:'#1C120B',margin:'0 0 16px',lineHeight:1.3}}>Elige una contraseña</h1>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1C120B',marginBottom:6}}>Contraseña</div>
            <div style={{height:44,border:'1px solid #E2CDB6',borderRadius:6,background:'#FFFDF8',position:'relative'}}>
              <div style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',opacity:0.4}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6654" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
            </div>
            <div style={{display:'flex',gap:4,marginTop:6}}>
              {[0,1,2].map(i=><div key={i} style={{height:4,flex:1,borderRadius:2,background:i===0?strengthColors[1]:'#E2CDB6'}}></div>)}
              <span style={{fontSize:11,color:strengthColors[1],fontWeight:700,marginLeft:6}}>Media</span>
            </div>
            <div style={{fontSize:11,color:'#7A6654',marginTop:4,fontWeight:300}}>Mínimo 10 caracteres.</div>
          </div>
          <FieldPreview label="Confirmar contraseña" value=""/>
          <BtnPreview>Crear cuenta</BtnPreview>
        </>}
      </div>
    </div>
  );
};

const RegisterDonePreview = () => (
  <div style={{minHeight:'100%',background:'#FAF6EF',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px 16px',fontFamily:"'Lato',sans-serif"}}>
    <div style={{background:'#FFFDF8',border:'1px solid #E2CDB6',borderRadius:6,padding:'40px 28px',width:'100%',maxWidth:380,display:'flex',flexDirection:'column',alignItems:'center',gap:16,textAlign:'center'}}>
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <h1 style={{fontFamily:"'EB Garamond',serif",fontSize:24,fontWeight:700,color:'#1C120B',margin:0}}>Cuenta creada</h1>

      <button style={{height:44,background:'#C25A1A',color:'#fff',border:'none',borderRadius:6,fontSize:15,fontWeight:700,fontFamily:"'Lato',sans-serif",cursor:'pointer',padding:'0 28px',width:'100%'}}>Ir a mi perfil</button>

);

// Small shared helpers for static previews
const FieldPreview = ({label, value, mono, helper}) => (
  <div style={{marginBottom:14}}>
    <div style={{fontSize:14,fontWeight:700,color:'#1C120B',marginBottom:5,fontFamily:"'Lato',sans-serif"}}>{label}</div>
    <div style={{height:44,border:'1px solid #E2CDB6',borderRadius:6,background:'#FFFDF8',padding:'0 12px',display:'flex',alignItems:'center',fontSize:value?14:13,color:value?'#1C120B':'#A89880',fontFamily:mono?'monospace':"'Lato',sans-serif",letterSpacing:mono?'0.12em':'normal'}}>{value||''}</div>
    {helper && <div style={{fontSize:11,color:'#7A6654',marginTop:4,fontWeight:300,fontFamily:"'Lato',sans-serif"}}>{helper}</div>}
  </div>
);
const BtnPreview = ({children, destructive}) => (
  <button style={{width:'100%',height:44,background:destructive?'#B42318':'#C25A1A',color:'#fff',border:'none',borderRadius:6,fontSize:15,fontWeight:700,fontFamily:"'Lato',sans-serif",cursor:'pointer',marginTop:4}}>{children}</button>
);

// Mount
const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<App/>);
